name: frontend_new
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  file_picker: ^6.1.1
  google_mlkit_pose_detection: ^0.13.0
  google_mlkit_commons: ^0.9.0
  image_cropper: ^5.0.1
  go_router: ^13.2.0
  provider: ^6.1.1
  http: ^1.1.0
  shared_preferences: ^2.2.2
  camera: ^0.10.5+9
  path_provider: ^2.1.2
  path: ^1.8.3
  dio: ^5.4.0
  flutter_dotenv: ^5.1.0
  kpostal: ^1.0.0
  webview_flutter: ^4.4.2
  jwt_decoder: ^2.0.1
  form_validator: ^2.1.1
  permission_handler: ^11.0.1
  image: ^4.1.7
  sensors_plus: ^4.0.2
  image_picker: ^1.0.7
  pdf: ^3.10.7
  share_plus: ^7.2.2
  intl: ^0.19.0
  fl_chart: ^0.66.2
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  assets:
    - assets/images/drawable-xxxhdpi/
    - assets/images/drawable-xxhdpi/
    - assets/images/drawable-xhdpi/
    - assets/images/drawable-hdpi/
    - assets/images/drawable-mdpi/
    - assets/images/drawable-ldpi/
    - .env
  uses-material-design: true

  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.ttf
        - asset: assets/fonts/NotoSansKR-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansKR-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansKR-Light.ttf
          weight: 300 